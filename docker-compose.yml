services:
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - INFERENCE_URL=http://inference:8001
      - MLOps_URL=http://mlops:8002
      # Segredos vem do arquivo .env (veja .env.example). Nunca versionar valores reais.
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      # O catalogo de atletas vem do servico de dados (Django). Fallback: JSON local.
      - DATA_URL=http://data:8003
    depends_on:
      inference:
        condition: service_started
      mlops:
        condition: service_started
      data:
        condition: service_healthy
    networks:
      - combat_net

  inference:
    build:
      context: ./services/inference
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      # Diretorio de onde a inferencia carrega os artefatos do modelo.
      # Compartilhado com o MLOps para que o modelo treinado esteja disponivel.
      - MODELS_DIR=/app/artifacts
    volumes:
      # Monta os modelos versionados/treinados pelo MLOps no diretorio lido pela inferencia.
      - ./services/mlops/models:/app/artifacts
    networks:
      - combat_net

  mlops:
    build:
      context: ./services/mlops
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - INFERENCE_URL=http://inference:8001
      # Conector de dados Kaggle (opcional; sem estas variaveis o pipeline usa o master.csv atual).
      - KAGGLE_USERNAME=${KAGGLE_USERNAME:-}
      - KAGGLE_KEY=${KAGGLE_KEY:-}
      - KAGGLE_DATASET=${KAGGLE_DATASET:-}
      - KAGGLE_CSV=${KAGGLE_CSV:-}
    volumes:
      - ./services/mlops/data:/app/data
      # O treinamento escreve em /app/models; mapeado para o host e compartilhado
      # com a inferencia (que le o mesmo diretorio via MODELS_DIR).
      - ./services/mlops/models:/app/models
    networks:
      - combat_net

  data:
    build:
      context: ./services/data
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_USER=${POSTGRES_USER:-combat_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-combat_pass}
      - POSTGRES_DB=${POSTGRES_DB:-combat_db}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dev-insecure-change-me}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-*}
      - DJANGO_CSRF_TRUSTED=${DJANGO_CSRF_TRUSTED:-http://localhost:8003}
      # Superusuario do Admin (dev). Em producao, defina no .env.
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-admin}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-admin123}
      # JSON do catalogo gerado pelo MLOps (montado read-only para o seed inicial).
      - CATALOG_JSON=/seed/fighters.json
    volumes:
      - ./services/gateway/app/data:/seed:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - combat_net

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-combat_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-combat_pass}
      - POSTGRES_DB=${POSTGRES_DB:-combat_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Healthcheck para o gateway so iniciar quando o Postgres aceitar conexoes.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-combat_user} -d ${POSTGRES_DB:-combat_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - combat_net

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - GATEWAY_URL=http://gateway:8000
    depends_on:
      - gateway
    networks:
      - combat_net

networks:
  combat_net:
    driver: bridge

volumes:
  pgdata: