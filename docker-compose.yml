services:
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - INFERENCE_URL=http://inference:8001
      - MLOps_URL=http://mlops:8002
      # Segredos vem do arquivo .env (veja .env.example). Nunca versionar valores reais.
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      # Driver psycopg2 explicito (SQLAlchemy 2.1 usa psycopg v3 por padrao em 'postgresql://').
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-combat_user}:${POSTGRES_PASSWORD:-combat_pass}@db:5432/${POSTGRES_DB:-combat_db}
    depends_on:
      inference:
        condition: service_started
      mlops:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - combat_net

  inference:
    build:
      context: ./services/inference
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      # Diretorio de onde a inferencia carrega os artefatos do modelo.
      # Compartilhado com o MLOps para que o modelo treinado esteja disponivel.
      - MODELS_DIR=/app/artifacts
    volumes:
      # Monta os modelos versionados/treinados pelo MLOps no diretorio lido pela inferencia.
      - ./services/mlops/models:/app/artifacts
    networks:
      - combat_net

  mlops:
    build:
      context: ./services/mlops
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - INFERENCE_URL=http://inference:8001
      # Conector de dados Kaggle (opcional; sem estas variaveis o pipeline usa o master.csv atual).
      - KAGGLE_USERNAME=${KAGGLE_USERNAME:-}
      - KAGGLE_KEY=${KAGGLE_KEY:-}
      - KAGGLE_DATASET=${KAGGLE_DATASET:-}
      - KAGGLE_CSV=${KAGGLE_CSV:-}
    volumes:
      - ./services/mlops/data:/app/data
      # O treinamento escreve em /app/models; mapeado para o host e compartilhado
      # com a inferencia (que le o mesmo diretorio via MODELS_DIR).
      - ./services/mlops/models:/app/models
    networks:
      - combat_net

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-combat_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-combat_pass}
      - POSTGRES_DB=${POSTGRES_DB:-combat_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Healthcheck para o gateway so iniciar quando o Postgres aceitar conexoes.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-combat_user} -d ${POSTGRES_DB:-combat_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - combat_net

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - GATEWAY_URL=http://gateway:8000
    depends_on:
      - gateway
    networks:
      - combat_net

networks:
  combat_net:
    driver: bridge

volumes:
  pgdata: