services:
  redis:
    image: redis:7-alpine
    container_name: comabat-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      

  inference:
      build:
        context: ./services/inference
        dockerfile: Dockerfile
      container_name: combat-inference
      ports:
        # formato "PORTA_DA_SUA_MAQUINA:PORTA_DENTRO_DO_CONTAINER" 
        - "8001:8001"
      
      # 'depends_on' garante que o Redis sobe antes dele.
      depends_on:
        - redis

volumes:
  redis_data: