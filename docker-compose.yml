version: '3.8'

services:
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - INFERENCE_URL=http://inference:8001
      - MLOps_URL=http://mlops:8002
      - INTERNAL_API_KEY=mlops_key_123
      - ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      - inference
      - mlops
    networks:
      - combat_net

  inference:
    build:
      context: ./services/inference
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - INTERNAL_API_KEY=mlops_key_123
    volumes:
      - ./services/inference/artifacts:/app/artifacts
    networks:
      - combat_net

  mlops:
    build:
      context: ./services/mlops
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - INTERNAL_API_KEY=mlops_key_123
      - INFERENCE_URL=http://inference:8001
    volumes:
      - ./data:/app/data
      - ./services/inference/artifacts:/app/artifacts
    networks:
      - combat_net

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - GATEWAY_URL=http://gateway:8000
    depends_on:
      - gateway
    networks:
      - combat_net

networks:
  combat_net:
    driver: bridge