services:
  - type: web
    name: combat-analytics-gateway
    env: python
    region: ohio
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    rootDir: services/gateway
    envVars:
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://combat-analytics-frontend.vercel.app"
        
  - type: web
    name: combat-analytics-inference
    env: docker
    region: ohio
    rootDir: services/inference
    envVars:
      - key: INTERNAL_API_KEY
        fromService:
          type: web
          name: combat-analytics-gateway
          envVarKey: INTERNAL_API_KEY

  - type: web
    name: combat-analytics-mlops
    env: docker
    region: ohio
    rootDir: services/mlops
    envVars:
      - key: INTERNAL_API_KEY
        fromService:
          type: web
          name: combat-analytics-gateway
          envVarKey: INTERNAL_API_KEY
